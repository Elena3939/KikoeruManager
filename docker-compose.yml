services:
  postgres:
    image: postgres:18.4
    container_name: kikoerumanager-postgres
    environment:
      POSTGRES_DB: kikoerumanager
      POSTGRES_USER: kikoerumanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kikoerumanager}
      PGDATA: /var/lib/postgresql/data
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - default_statistics_target=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kikoerumanager -d kikoerumanager"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  kikoerumanager:
    build:
      context: .
      dockerfile: Dockerfile
    image: kikoerumanager:latest
    container_name: kikoerumanager
    ports:
      # host_port:container_port — 容器内 uvicorn 默认监听 5555，可通过 PORT 环境变量修改
      - "5555:5555"
    volumes:
      # --- 应用数据（建议放在一个独立的 Docker 数据共享文件夹下）---
      # 配置文件目录，保存 config.yaml
      - /volume1/docker/kikoerumanager/config:/app/config
      # 数据库、日志等运行时数据
      - /volume1/docker/kikoerumanager/data:/app/data

      # --- 业务目录（路径改成你群晖上实际的共享文件夹）---
      # 待处理压缩包的输入目录（把下载好的 zip/7z 丢进这个文件夹）
      - /volume1/incoming:/input
      # 解压过程中使用的临时目录（建议和 library 在同一 volume 避免跨卷 copy）
      - /volume1/ASMR/temp:/temp
      # 最终整理完的作品库目录（这里填你主要的 ASMR 收藏目录）
      - /volume1/ASMR:/library
      # 已有作品目录（用于重复检查，若和 library 相同则填一样的路径）
      - /volume1/ASMR:/existing
      # 已处理的原始压缩包归档目录（处理完的 zip 会移动到这里）
      - /volume1/ASMR/processed:/processed
    environment:
      - CONFIG_PATH=/app/config/config.yaml
      - DATA_PATH=/app/data
      - DATABASE_URL=postgresql+psycopg://kikoerumanager:${POSTGRES_PASSWORD:-kikoerumanager}@postgres:5432/kikoerumanager?sslmode=disable
      - TZ=Asia/Shanghai
      - PORT=5555
    depends_on:
      postgres:
        condition: service_healthy
    # 使用 root 权限运行（文件操作需要）
    user: "0:0"
    privileged: true
    # 性能优化
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://localhost:' + os.environ.get('PORT','5555') + '/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
