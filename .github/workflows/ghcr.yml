name: Build and Push to GitHub Container Registry

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest
          type=edge,branch=main

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          ${{ steps.meta.outputs.labels }}
          org.opencontainers.image.version=${{ github.ref_name }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        build-args: |
          KIKOERUMANAGER_VERSION=${{ github.ref_name }}
        no-cache: true
        platforms: linux/amd64

    - name: Add package description
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const readme = fs.readFileSync('./README.md', 'utf8');
          try {
            await github.rest.packages.updatePackageDescriptionForAuthenticatedUser({
              package_type: 'container',
              package_name: '${{ github.event.repository.name }}',
              description: 'DLsite 作品自动整理工具 - 支持智能查重、自动解压、元数据获取',
            });
          } catch (error) {
            console.log('Package description update failed:', error.message);
          }
