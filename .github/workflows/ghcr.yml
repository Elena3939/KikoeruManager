name: Build and Push to GHCR and Docker Hub

on:
  push:
    # 只在打了 vX.Y.Z 形式的版本 tag 时才触发整个 workflow。
    # master / main 分支推送不会再触发任何 job（包括 Docker Hub README 同步），
    # 确保 Actions 只在正式发版时才跑起来。
    tags: [ 'v*.*.*' ]

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: elena39/kikoerumanager

jobs:
  # 构建并推送 Docker image——只在 vX.Y.Z tag 推送时触发
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.GHCR_IMAGE }}
          ${{ env.DOCKERHUB_IMAGE }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          KIKOERUMANAGER_VERSION=${{ github.ref_name }}
        no-cache: true
        platforms: linux/amd64

  # 把 GitHub README 同步到 Docker Hub 仓库的 Overview，避免 Docker Hub 上长期是 "No overview available"
  # 每次 vX.Y.Z tag 推送时跟着 image 构建一起跑一次；独立于构建，不依赖 image 推送是否成功
  sync-dockerhub-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "DLsite 同人音声压缩包智能管理工具"
          readme-filepath: ./README.md
          enable-url-completion: true
