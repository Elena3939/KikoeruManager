name: Build Windows EXE and Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pyinstaller pystray pillow

    - name: Build EXE (console + noconsole)
      working-directory: backend
      run: python build.py

    - name: Package archives
      shell: pwsh
      run: |
        $tag = "${{ github.event.inputs.tag }}"
        if (-not $tag) { $tag = "${{ github.ref_name }}" }
        Compress-Archive -Path backend/dist/KikoeruManager.exe -DestinationPath "kikoerumanager-$tag-windows-console.zip" -Force
        Compress-Archive -Path backend/dist/KikoeruManager-noconsole.exe -DestinationPath "kikoerumanager-$tag-windows-noconsole.zip" -Force
        Get-ChildItem *.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag || github.ref_name }}
        name: ${{ github.event.inputs.tag || github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          *.zip
