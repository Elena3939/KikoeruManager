    pattern: (?:SE|音 | 音效)(?:[な無] し|CUT)|(?:無 | なし)(?:SE|音 | 音效)
    target: folder
    action: exclude
    enabled: true
  - name: 过滤 MP3 文件
    pattern: .mp3$
    target: file
    action: exclude
    enabled: true
