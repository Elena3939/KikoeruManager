storage:
  input_path: D:\VJC\ziliao\新建文件夹\待处理
  temp_path: D:\VJC\ziliao\新建文件夹\temp
  library_path: D:\VJC\ziliao\新建文件夹\asmr
  processed_archives_path: D:\VJC\ziliao\新建文件夹\新建文件夹
  existing_folders_path: E:\0\临时\asmr\已存在
  asmr_subtitle_path: E:\0\临时\asmr\字幕
processing:
  max_workers: 5
  retry_count: 3
  file_stable_checks: 3
  file_stable_interval: 2
  max_wait_time: 3600
  archive_idle_delay_seconds: 60
  archive_poll_interval_seconds: 3
  archive_retry_delay_seconds: 300
  archive_max_retry_count: 5
database:
  host: 127.0.0.1
  port: 5432
  database: kikoerumanager
  username: kikoerumanager
  password: ''
  sslmode: prefer
  connect_timeout_seconds: 10
  pool_size: 10
  max_overflow: 20
  pool_recycle_seconds: 1800
  pool_timeout_seconds: 30
  statement_timeout_ms: 120000
  startup_health_check: true
  slow_query_monitor_enabled: true
  slow_query_threshold_ms: 500
  auto_explain_enabled: false
  auto_explain_threshold_ms: 1000
  search_backend: pg_trgm
redis:
  enabled: true
  required: true
  url: redis://localhost:6379/0
  namespace: kikoerumanager
  environment: prod
  socket_timeout_seconds: 2.0
  connect_timeout_seconds: 2.0
  runtime_ttl_seconds: 259200
  short_cache_ttl_seconds: 60
  event_stream_maxlen: 50000
  dirty_stream_maxlen: 200000
runtime_buffer:
  enabled: true
  backend: redis
  progress_flush_interval_seconds: 5.0
  log_stream_batch_size: 300
  log_stream_flush_ms: 250
bonus_probe:
  max_active_jobs: 1
  normal_batch_size: 500
  normal_concurrency: 6
  deep_batch_size: 500
  deep_concurrency: 6
  new_release_batch_size: 100
  new_release_concurrency: 6
  max_batch_size: 500
  max_concurrency: 6
  product_info_total_concurrency: 6
  cache_lookup_batch_size: 1000
  cache_write_batch_size: 100
watcher:
  enabled: false
  scan_interval: 30
  auto_start: true
  auto_classify: true
  delete_after_process: false
extract:
  seven_zip_path: D:\VJC\7-Zip\7z.exe
  auto_repair_extension: true
  verify_after_extract: true
  password_list: []
  filename_password_sniff_enabled: true
  filename_password_sniff_templates:
  - '{name}({password})'
  - '{name}（{password}）'
  extract_nested_archives: true
  max_nested_depth: 5
filter:
  enabled: true
  filter_dir: true
  rules:
  - name: 过滤明确无 SE / CUT 的文件
    pattern: (?i)(?:(?:^|[^A-Za-z0-9])(?:se|sound|sfx|音|音效|音楽|効果音)(?:\s*[&＆]\s*(?:music|音楽))?[\s._-]*(?:なし|無し|无|無|cut|切除|削减|カット版)(?:$|[^A-Za-z0-9])|(?:^|[^A-Za-z0-9])(?:无|無|なし|無し|without|不含)[\s._-]*(?:se|sound|sfx|音|音效|効果音)(?:$|[^A-Za-z0-9])|(?:^|[^A-Za-z0-9])(?:音声のみ|se\s*cut|effects?\s*wav|効果音カット版|カウントダウンなし|bgmなし|seoff|nose|無射精音|反転|左右逆)(?:$|[^A-Za-z0-9]))
    target: all
    action: exclude
    enabled: true
  - name: 过滤 MP3 文件
    pattern: (?i)\.mp3$
    target: file
    action: exclude
    enabled: true
metadata:
  locale: zh_cn
  connect_timeout: 10
  read_timeout: 10
  sleep_interval: 3
  http_proxy: 127.0.0.1:7897
  cache_enabled: true
  fetch_cover: false
  make_folder_icon: false
  remove_jpg_file: true
rename:
  template: '[{maker_name}][{rjcode}]{cvs}'
  date_format: '%y%m%d'
  delimiter: ' '
  cv_list_left: '(CV '
  cv_list_right: )
  exclude_square_brackets: false
  illegal_char_to_full_width: true
  tags_max_number: 5
  tags_ordered_list: []
  flatten_single_subfolder: true
  flatten_depth: 3
  remove_empty_folders: true
  api_rename_follow_template: true
  use_japanese_metadata: true
classification:
- type: maker
  enabled: true
  path_template: '{maker_name}'
  custom_name: null
  fallback: null
  max_tags: null
  rjcode_range: null
password_cleanup:
  enabled: false
  max_use_count: 2
  cron_expression: 0 0 * * 0
  preserve_days: 30
  exclude_sources: []
processed_archive_cleanup:
  enabled: false
  cron_expression: 0 0 * * 0
  strategy: age
  preserve_days: 7
  max_count: 1000
  max_size_gb: 50
  exclude_reprocessing: true
  scan_on_startup: true
  min_keep_count: 10
path_mapping:
  enabled: false
  rules: []
  open_mode: auto
kikoeru_server:
  enabled: false
  server_url: ''
  username: ''
  password: ''
  api_token: ''
  token_expires: 0
  timeout: 10
  cache_ttl: 50
  http_proxy: ''
  check_in_preextract: true
  retry_count: 3
  retry_delay: 1.0
asmr_sync:
